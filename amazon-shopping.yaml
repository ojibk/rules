  # 2. 欧洲全域站点 (Europe)
  # ══════════════════════════════════════════════════════════════════════
  - '+.amazon.co.uk'          # 英国
  - '+.amazon.de'             # 德国
  - '+.amazon.fr'             # 法国
  - '+.amazon.it'             # 意大利
  - '+.amazon.es'             # 西班牙
  - '+.amazon.nl'             # 荷兰
  - '+.amazon.pl'             # 波兰
