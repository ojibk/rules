  # ══════════════════════════════════════════════════════════════════════
  # 4. 中东与非洲新兴市场 (Middle East & Africa)
  # ══════════════════════════════════════════════════════════════════════
  - '+.amazon.ae'             # 阿联酋
  - '+.amazon.sa'             # 沙特阿拉伯
  - '+.amazon.eg'             # 埃及
  - '+.amazon.com.tr'         # 土耳其
  - '+.amazon.com.za'         # 南非

  # ══════════════════════════════════════════════════════════════════════
  # 5. 国际化非标准域名与本地转码后缀 (IDN / Specific)
  # ══════════════════════════════════════════════════════════════════════
  - '+.xn--jlq480n2rg'        # "亚马逊" 中文字符串转码后缀
  - '+.xn--cckwcxetd'        # "アマゾン" 日语片假名字符串转码后缀
  - '+.amaaozn.com'           # 官方防买家拼写错误劫持域名
  - '+.aboutamazon.com'       # 亚马逊全球官方企业公关/政策公告主站
  - '+.aboutamazon.cn'        # 亚马逊中国官方公关网

  # ══════════════════════════════════════════════════════════════════════
