  - '+.amazonbusiness.cn'     # 亚马逊企业购中国区前后台
  - '+.amazonbusiness.com.cn' # 亚马逊企业购中国区变体
  - '+.amazon-fashions.com'   # 服装配饰特定类目后台资源与组件库
  - '+.amazonlaunchpad.com'   # 亚马逊发明家 Launchpad 品牌计划主站
  - '+.amazon-launchpad.com'  # 亚马逊发明家品牌计划防劫持变体
  - '+.amazonvine.com'        # 亚马逊 Vine 绿标测评计划官方门户
  - '+.amazontrust.com'       # 亚马逊数字证书信任根基础设施
  - '+.amazon.dev'            # 亚马逊开发者与广告生态级联网关
  - '+.amazon-adsystem.com'   # 全站 Listing 推荐位与赞助商组件加载源
