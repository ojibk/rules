# NAME: Amazon_Global_Shopping
# 名称: 亚马逊全球购物
# DESCRIPTION: Amazon Shopping, Media, Ads & Seller Network Rule-Set (Excl. AWS)
# 描述: 全球零售站点 + 图片资源 + 广告与前端组件库 + 卖家及物流体系规则集（不含 AWS 基础云）
# TOTAL_ITEMS: 77
# format: yaml / text / mrs
# 若需本地转成 mrs 格式，可将此文件置于 mihomo 内核目录下，在终端中执行转换命令：
# cd "D:\Program Files\Clash Verge"
# Windows: .\verge-mihomo convert-ruleset domain yaml amazon-shopping.yaml amazon-shopping.mrs（注意：需先清洗行首 - 符号）
# Linux/macOS: ./verge-mihomo convert-ruleset domain yaml amazon-shopping.yaml amazon-shopping.mrs（注意：需先清洗行首 - 符号）

payload:
