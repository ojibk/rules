  - '+.amazon.jp'             # 日本快捷域名
  - '+.amazon.sg'             # 新加坡
  - '+.amazon.com.au'         # 澳大利亚
  - '+.amazon.in'             # 印度
  - '+.amazon.cn'             # 中国（海外购/电子书基础设施）
